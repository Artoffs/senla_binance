services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: binance
    ports:
      - "5432:5432"
    volumes:
      - pg_data_binance:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d binance" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senla-binance-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/binance
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      BINANCE_POLL_INTERVAL: ${BINANCE_POLL_INTERVAL:-PT30S}
      BINANCE_DEFAULT_SYMBOL: ${BINANCE_DEFAULT_SYMBOL:-BNBUSDT}
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://api.binance.com/}
    ports:
      - "8080:8080"

volumes:
  pg_data_binance: